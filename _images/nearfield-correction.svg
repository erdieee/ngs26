<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">Nearfield correction split</title>
  <desc id="desc">A base potential evaluation is corrected by replacing the poorly resolved near element singular part with an analytical triangle integral.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="980" height="430" fill="#ffffff"/>
  <path d="M 75 285 C 170 236 246 272 337 229 C 427 185 514 216 607 172 C 718 120 814 156 905 112" fill="none" stroke="#cbd5e1" stroke-width="18" stroke-linecap="round" opacity="0.75"/>
  <path d="M 337 229 C 380 207 422 203 468 198" fill="none" stroke="#2563eb" stroke-width="20" stroke-linecap="round"/>
  <path d="M 337 229 C 380 207 422 203 468 198" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="450" cy="92" r="7" fill="#dc2626"/>
  <text x="464" y="88" font-family="Inter, Arial, sans-serif" font-size="26" fill="#991b1b">x</text>
  <line x1="450" y1="92" x2="417" y2="202" stroke="#334155" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <text x="380" y="250" font-family="Inter, Arial, sans-serif" font-size="23" fill="#1e3a8a">near element</text>
  <text x="82" y="330" font-family="Inter, Arial, sans-serif" font-size="24" fill="#475569">base evaluation</text>
  <text x="83" y="360" font-family="Inter, Arial, sans-serif" font-size="20" fill="#64748b">standard quadrature or local expansion</text>
  <path d="M 633 258 H 880" stroke="#0f172a" stroke-width="2"/>
  <text x="632" y="218" font-family="Inter, Arial, sans-serif" font-size="26" fill="#0f172a">add correction</text>
  <text x="632" y="252" font-family="Inter, Arial, sans-serif" font-size="22" fill="#0f172a">analytic triangle integral</text>
  <text x="632" y="292" font-family="Inter, Arial, sans-serif" font-size="22" fill="#0f172a">minus flat quadrature</text>
  <text x="632" y="332" font-family="Inter, Arial, sans-serif" font-size="22" fill="#0f172a">times source value at p0</text>
  <line x1="530" y1="205" x2="615" y2="250" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
