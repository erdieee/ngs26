<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" role="img" aria-labelledby="title desc">
  <title id="title">Nearfield target and tangent triangle</title>
  <desc id="desc">A target point close to a triangular source element, projected onto a local tangent triangle.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="880" height="470" fill="#ffffff"/>
  <path d="M 110 310 C 230 250 330 290 455 240 C 565 195 650 230 770 188" fill="none" stroke="#cbd5e1" stroke-width="16" stroke-linecap="round" opacity="0.7"/>
  <path d="M 142 330 L 512 272 L 332 112 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
  <path d="M 156 316 L 500 268 L 344 128 Z" fill="#eff6ff" stroke="#60a5fa" stroke-width="2" stroke-dasharray="8 7"/>
  <circle cx="142" cy="330" r="5" fill="#1d4ed8"/>
  <circle cx="512" cy="272" r="5" fill="#1d4ed8"/>
  <circle cx="332" cy="112" r="5" fill="#1d4ed8"/>
  <text x="112" y="356" font-family="Inter, Arial, sans-serif" font-size="22" fill="#0f172a">v0</text>
  <text x="520" y="292" font-family="Inter, Arial, sans-serif" font-size="22" fill="#0f172a">v1</text>
  <text x="326" y="88" font-family="Inter, Arial, sans-serif" font-size="22" fill="#0f172a">v2</text>
  <circle cx="354" cy="228" r="6" fill="#0f172a"/>
  <text x="366" y="235" font-family="Inter, Arial, sans-serif" font-size="24" fill="#0f172a">p0</text>
  <circle cx="430" cy="102" r="7" fill="#dc2626"/>
  <text x="445" y="96" font-family="Inter, Arial, sans-serif" font-size="26" fill="#991b1b">x</text>
  <line x1="430" y1="102" x2="354" y2="228" stroke="#334155" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <text x="407" y="174" font-family="Inter, Arial, sans-serif" font-size="20" fill="#334155">distance h</text>
  <line x1="354" y1="228" x2="354" y2="150" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="365" y="169" font-family="Inter, Arial, sans-serif" font-size="22" fill="#1d4ed8">n</text>
  <text x="122" y="398" font-family="Inter, Arial, sans-serif" font-size="24" fill="#1e3a8a">flat tangent triangle T_flat</text>
  <text x="548" y="158" font-family="Inter, Arial, sans-serif" font-size="24" fill="#475569">curved source element T</text>
  <path d="M 540 178 C 584 154 620 151 674 136" fill="none" stroke="#64748b" stroke-width="3"/>
</svg>
